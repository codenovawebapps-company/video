<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinematic Video Experience</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="ambient-glow" aria-hidden="true">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>
  </div>

  <main class="app-container">
    <!-- Launch Section with Big Action Button -->
    <section id="launch-screen" class="launch-screen">
      <div class="badge">
        <span class="badge-dot"></span>
        <span class="badge-text">Ready to Stream</span>
      </div>

      <h1 class="hero-title">Experience <span class="gradient-text">The Moment</span></h1>
      <p class="hero-subtitle">Tap below to initiate instant playback with high-fidelity sound and visuals.</p>

      <!-- The Big Hero Button -->
      <button id="start-btn" class="big-play-button" aria-label="Play Video Now">
        <span class="pulse-ring ring-1"></span>
        <span class="pulse-ring ring-2"></span>
        <span class="pulse-ring ring-3"></span>

        <div class="button-inner">
          <div class="icon-wrap">
            <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z" />
            </svg>
          </div>
          <span class="btn-text">PLAY VIDEO</span>
          <span class="btn-subtext">Instant Auto-Playback</span>
        </div>
      </button>
    </section>

    <!-- Video Theater Section (Hidden initially, reveals when clicked) -->
    <section id="video-theater" class="video-theater hidden" aria-hidden="true">
      <header class="theater-header">
        <button id="back-btn" class="nav-btn" title="Back to menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7" />
          </svg>
          <span>Return</span>
        </button>

        <div class="now-playing">
          <span class="status-live">NOW PLAYING</span>
        </div>

        <div class="header-actions">
          <button id="pip-btn" class="nav-btn icon-only" title="Picture in Picture">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <rect x="11" y="9" width="9" height="6" rx="1"></rect>
            </svg>
          </button>
          <button id="fullscreen-btn" class="nav-btn icon-only" title="Toggle Fullscreen">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
            </svg>
          </button>
        </div>
      </header>

      <div class="player-wrapper">
        <video id="main-video" preload="auto" controls playsinline
          src="WhatsApp%20Video%202026-10-27%20at%2022.30.41.mp4">
          Your browser does not support HTML5 video.
        </video>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>

</html>
